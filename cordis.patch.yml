# dsh bundle patch：洛洛可全家桶
#
# **只插宿主行，不插 preset。**
#
# 宿主行挂在 profile 层，不带 config —— 所以它不会挂任何子模块（子模块只在配置桶
# 存在时挂载）。preset 是**用户的东西**，不归包管：包里插的 preset 每次重装都会被
# 仓库版本顶回去，改个 description 都得走一遍 commit + 重装。
#
# preset 写在 profile 自己的 patch 层：`$DSH_HOME/profiles/<profile>/cordis.patch.yml`
# （与 bundle patch 同语法，`- insert:` 一个数组），想开几个开几个，各用各的 id：
#
#   - insert:
#       - id: preset-roroko
#         name: '@deepseek-ai/dsh-agent-preset'
#         config:
#           id: roroko
#           name: 洛洛可
#           description: 随便写，改完重启就生效
#           order: 30
#           plugins:
#             - id: roroko-tool
#               name: '@roroko-tool/dsh-roroko-tool'
#               config:
#                 preinject: {}     # 给桶 = 挂载；清单与开关走设置页
#                 datas: {}
#             - id: tool-fs
#               name: '@deepseek-ai/dsh-tool-fs'
#             # …其余工具行照抄标准 preset
- insert:
    - id: roroko-tool
      name: '@roroko-tool/dsh-roroko-tool'

